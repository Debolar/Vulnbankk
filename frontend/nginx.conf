server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Blokuj dostęp do source maps
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # Blokuj dostęp do plików wrażliwych
    location ~ \.(env|config|credentials)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
